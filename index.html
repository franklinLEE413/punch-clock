<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:radial-gradient(circle at top left,rgba(224,199,174,.45),transparent 35%),radial-gradient(circle at bottom right,rgba(178,199,193,.36),transparent 38%),var(--bg)}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(22px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom))}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0 18px}.tile,.panel,.block{border:1px solid var(--line);background:rgba(255,255,255,.48)}.tile{border-radius:20px;padding:14px}.tile span{display:block;margin-bottom:6px;font-size:12px;color:var(--muted)}.tile strong{display:block;font-variant-numeric:tabular-nums;font-size:22px;letter-spacing:-.02em}

.actions{display:grid;gap:10px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}button,input{font-family:inherit}button{width:100%;border:0;border-radius:20px;min-height:56px;padding:0 18px;font-size:17px;font-weight:720;cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed;box-shadow:none}.primary{color:var(--primaryText);background:var(--primary);box-shadow:0 10px 24px rgba(35,35,35,.16)}.locked{color:var(--muted);background:rgba(255,255,255,.42);border:1px solid var(--line);box-shadow:none}.secondary{color:var(--text);background:rgba(255,255,255,.56);border:1px solid var(--line);box-shadow:none;font-size:15px;font-weight:680;min-height:48px}.ok{color:var(--ok)}.danger{color:var(--danger)}

.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.sheet-title{font-size:18px;font-weight:760}.close{width:auto;min-height:36px;padding:0 13px;border-radius:999px;font-size:14px;background:rgba(35,35,35,.08);color:var(--text);box-shadow:none}.block{padding:14px;border-radius:22px;margin-top:10px}.form-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;margin-bottom:10px}.form-label{font-size:13px;color:var(--muted);line-height:1.4}input[type=time]{width:116px;min-height:42px;padding:0 10px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--text);font-size:18px;font-weight:680;font-variant-numeric:tabular-nums}.mini{min-height:46px;margin-top:8px;font-size:15px;border-radius:16px}.hint{margin:10px 2px 0;color:var(--muted);font-size:13px;line-height:1.6}

@media(prefers-color-scheme:dark){:root{--bg:#171615;--card:rgba(33,31,29,.74);--text:#f3eee8;--muted:#afa69d;--line:rgba(255,255,255,.10);--primary:#f3eee8;--primaryText:#171615;--ok:#9fc4ad;--warn:#d9ba82;--danger:#e18b7d}html,body{background:radial-gradient(circle at top left,rgba(115,87,64,.36),transparent 34%),radial-gradient(circle at bottom right,rgba(80,109,103,.28),transparent 38%),var(--bg)}.tile,.secondary,.block,.panel{background:rgba(255,255,255,.06)}.locked{background:rgba(255,255,255,.06)}.progress-wrap,.bar-bg{background:rgba(255,255,255,.10)}.progress{background:linear-gradient(90deg,rgba(243,238,232,.62),rgba(243,238,232,.95))}.sheet{background:rgba(33,31,29,.88)}input[type=time]{background:rgba(255,255,255,.08)}.close,.stat{background:rgba(255,255,255,.10)}}
</style>
</head>
<body>
<main><section class="card">
  <div class="top"><div><div class="label">TODAY</div><div class="today" id="todayText">--</div></div><div class="label" id="nowText">--:--</div></div>
  <div class="hero"><p class="hero-title" id="heroTitle">预计下班</p><h1 class="off-time" id="offTime">--:--</h1><div class="status" id="statusText">点击下方按钮记录今天的打卡时间</div></div>
  <div class="grid"><div class="tile"><span>打卡时间</span><strong id="punchTime">--:--</strong></div><div class="tile"><span>工时</span><strong>8.5h</strong></div></div>
  <div class="progress-wrap"><div class="progress" id="progressBar"></div></div>
  <section class="panel"><div class="panel-head"><div class="panel-title">近7日趋势</div><div class="panel-value" id="trendValue">暂无记录</div></div><svg class="spark" id="spark" viewBox="0 0 360 54" preserveAspectRatio="none"></svg><div class="empty" id="sparkEmpty">暂无足够记录</div></section>
  <div class="actions"><button class="primary" id="punchBtn">打卡</button><div class="row2"><button class="secondary" id="editBtn">调整</button><button class="secondary ok" id="remindBtn">提醒</button></div></div>
</section></main>
<div class="mask" id="mask"><section class="sheet">
  <div class="sheet-head"><div class="sheet-title">调整</div><button class="close" id="closeBtn">关闭</button></div>
  <div class="block"><div class="form-row"><div class="form-label">修改 / 补录上班打卡</div><input id="manualInput" type="time" value="08:50"></div><button class="primary mini" id="saveBtn">保存打卡时间</button><div class="hint" id="manualHint">打卡后主按钮会锁定；如需修改，只能从这里调整。</div></div>
  <div class="block"><div class="form-row"><div class="form-label">按目标下班时间反推</div><input id="offInput" type="time" value="17:20"></div><button class="secondary mini" id="reverseBtn">反推并填入打卡时间</button><div class="hint" id="reverseHint">例如 17:20 下班，需要 08:50 打卡。</div></div>
  <div class="block"><div class="sheet-title" style="font-size:16px;margin-bottom:10px">近7日趋势</div><div class="stats"><div class="stat"><span>平均</span><strong id="avgStat">--:--</strong></div><div class="stat"><span>最早</span><strong id="earlyStat">--:--</strong></div><div class="stat"><span>最晚</span><strong id="lateStat">--:--</strong></div></div><div class="trend-list" id="trendList"></div><div class="hint" id="trendHint">只统计本机浏览器保存过的记录。</div></div>
  <div class="block"><button class="secondary mini" id="copyBtn">复制今日时间</button><button class="secondary mini" id="calendarBtn">生成日历提醒</button><button class="secondary mini" id="notifyBtn">开启网页通知</button><button class="secondary danger mini" id="resetBtn">重置今天</button><div class="hint">网页通知适合页面保持打开时使用；日历提醒会生成 .ics 文件，可尝试导入系统日历。</div></div>
</section></div>
<div class="toast" id="toast"></div>
<script>
(()=>{const WORK=510,EARLY=510,LATE=570,KEY="simplePunchClock.records.v3",OLDS=["simplePunchClock.records.v2","simplePunchClock.records.v1"],$=id=>document.getElementById(id),pad=n=>String(n).padStart(2,"0");
const E={today:$("todayText"),now:$("nowText"),hero:$("heroTitle"),off:$("offTime"),status:$("statusText"),punch:$("punchTime"),btn:$("punchBtn"),edit:$("editBtn"),remind:$("remindBtn"),prog:$("progressBar"),value:$("trendValue"),spark:$("spark"),empty:$("sparkEmpty"),mask:$("mask"),close:$("closeBtn"),manual:$("manualInput"),offInput:$("offInput"),save:$("saveBtn"),reverse:$("reverseBtn"),manualHint:$("manualHint"),reverseHint:$("reverseHint"),copy:$("copyBtn"),cal:$("calendarBtn"),notify:$("notifyBtn"),reset:$("resetBtn"),list:$("trendList"),avg:$("avgStat"),early:$("earlyStat"),late:$("lateStat"),trendHint:$("trendHint"),toast:$("toast")};
let rt=null,tt=null,notified=null;
function key(d=new Date()){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function fmt(d){return `${pad(d.getHours())}:${pad(d.getMinutes())}`}
function fmin(m){if(m==null||Number.isNaN(m))return"--:--";m=Math.round(m);return `${pad(Math.floor(m/60)%24)}:${pad(((m%60)+60)%60)}`}
function dateLabel(d){return `${d.getMonth()+1}月${d.getDate()}日 周${"日一二三四五六"[d.getDay()]}`}
function parseTime(t,b=new Date()){let[h,m]=t.split(":").map(Number),d=new Date(b);d.setHours(h,m,0,0);return d}
function minOf(d){return d.getHours()*60+d.getMinutes()}
function add(d,m){return new Date(d.getTime()+m*60000)}
function offDate(p){return add(p,WORK)}
function punchFromOff(o){return add(o,-WORK)}
function remain(ms){let t=Math.max(0,Math.ceil(ms/60000)),h=Math.floor(t/60),m=t%60;if(!h&&!m)return"可以下班了";if(!h)return`还有 ${m} 分钟`;return m?`还有 ${h} 小时 ${m} 分钟`:`还有 ${h} 小时`}
function safe(k){try{return JSON.parse(localStorage.getItem(k))||{}}catch{return{}}}
function norm(r){let o={};Object.entries(r||{}).forEach(([k,v])=>{let p=v?.punchAt||v?.time||v,d=new Date(p);if(!isNaN(d))o[k]={punchAt:d.toISOString(),source:v?.source||"migrated",createdAt:v?.createdAt||d.toISOString(),updatedAt:v?.updatedAt||d.toISOString()}});return o}
function load(){let c=norm(safe(KEY));if(Object.keys(c).length)return c;for(let old of OLDS){let r=norm(safe(old));if(Object.keys(r).length){localStorage.setItem(KEY,JSON.stringify(r));return r}}return{}}
function saveAll(r){localStorage.setItem(KEY,JSON.stringify(r))}
function todayRec(){return load()[key()]||null}
function toast(s){clearTimeout(tt);E.toast.textContent=s;E.toast.classList.add("show");tt=setTimeout(()=>E.toast.classList.remove("show"),2200)}
function savePunch(d,source="manual"){let r=load(),k=key(d),old=r[k];r[k]={punchAt:d.toISOString(),source,createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};saveAll(r);notified=null;render();toast(`已保存，预计 ${fmt(offDate(d))} 下班`)}
function week(){let r=load(),days=[],t=new Date();t.setHours(0,0,0,0);for(let i=6;i>=0;i--){let d=new Date(t);d.setDate(t.getDate()-i);let k=key(d),rec=r[k],pd=rec?new Date(rec.punchAt):null;days.push({date:d,rec,pd,minutes:pd?minOf(pd):null})}return days}
function tag(m){if(m==null)return["未记","muted"];if(m<EARLY)return["偏早","warn"];if(m>LATE)return["偏晚","warn"];return["正常","ok"]}
function renderTrend(){let data=week(),valid=data.filter(x=>x.minutes!=null),avg=valid.length?valid.reduce((s,x)=>s+x.minutes,0)/valid.length:null,min=valid.length?Math.min(...valid.map(x=>x.minutes)):null,max=valid.length?Math.max(...valid.map(x=>x.minutes)):null;E.avg.textContent=fmin(avg);E.early.textContent=fmin(min);E.late.textContent=fmin(max);E.value.textContent=valid.length?`均值 ${fmin(avg)}`:"暂无记录";E.list.innerHTML="";data.forEach(x=>{let row=document.createElement("div");row.className="trend-row";let [txt,cls]=tag(x.minutes),pct=x.minutes==null?0:Math.max(6,Math.min(100,((x.minutes-495)/(585-495))*100));row.innerHTML=`<div>${x.date.getMonth()+1}/${x.date.getDate()}</div><div class="trend-time">${x.minutes==null?"--:--":fmin(x.minutes)}</div><div class="bar-bg"><div class="bar" style="width:${pct}%"></div></div><div class="tag ${cls}">${txt}</div>`;E.list.appendChild(row)});E.trendHint.textContent=valid.length?`已统计近7天中的 ${valid.length} 天记录。`:"暂无打卡记录；之后每天打卡会自动形成趋势。";renderSpark(data)}
function renderSpark(data){E.spark.innerHTML="";let pts=data.map((x,i)=>({...x,i})).filter(x=>x.minutes!=null);if(!pts.length){E.empty.style.display="block";E.spark.style.display="none";return}E.empty.style.display="none";E.spark.style.display="block";let min=500,max=575,y=m=>54-((Math.max(min,Math.min(max,m))-min)/(max-min))*(44)-5,arr=pts.map(p=>({x:p.i*60,y:y(p.minutes)}));if(arr.length>=2){let path=document.createElementNS("http://www.w3.org/2000/svg","path");path.setAttribute("d",arr.map((p,i)=>`${i?"L":"M"} ${p.x} ${p.y}`).join(" "));E.spark.appendChild(path)}arr.forEach(p=>{let c=document.createElementNS("http://www.w3.org/2000/svg","circle");c.setAttribute("cx",p.x);c.setAttribute("cy",p.y);c.setAttribute("r","4");E.spark.appendChild(c)})}
function askNotify(){if(!("Notification"in window)){toast("当前浏览器不支持网页通知");return}if(Notification.permission==="granted"){toast("网页通知已开启");return}if(Notification.permission==="denied"){toast("通知已被系统拒绝，请到设置里开启");return}Notification.requestPermission().then(r=>toast(r==="granted"?"网页通知已开启":"未开启网页通知")).catch(()=>toast("未开启网页通知"))}
function fire(o){let k=key(o);if(notified===k)return;notified=k;if("Notification"in window&&Notification.permission==="granted"){try{new Notification("到下班时间了",{body:`今天预计 ${fmt(o)} 下班。`})}catch{}}try{navigator.vibrate?.([120,60,120])}catch{}toast(`到下班时间了，今天预计 ${fmt(o)} 下班。`)}
function schedule(o){clearTimeout(rt);let d=o-Date.now();if(d>0&&d<=2147483647)rt=setTimeout(()=>fire(o),d)}
function setInputs(){let r=todayRec();if(r){let p=new Date(r.punchAt),o=offDate(p);E.manual.value=fmt(p);E.offInput.value=fmt(o);E.reverseHint.textContent=`当前 ${fmt(p)} 打卡，预计 ${fmt(o)} 下班。`}else{E.manual.value="08:50";E.offInput.value="17:20";E.reverseHint.textContent="例如 17:20 下班，需要 08:50 打卡。"}hint()}
function hint(){let m=minOf(parseTime(E.manual.value));E.manualHint.textContent=m<EARLY?"这个时间早于 08:30，可以保存；请确认是否为真实打卡。":m>LATE?"这个时间晚于 09:30，可以保存；近7日趋势会标记为偏晚。":"打卡后主按钮会锁定；如需修改，只能从这里调整。"}
function currentText(){let r=todayRec();if(!r)return"";let p=new Date(r.punchAt),o=offDate(p);return`今天 ${fmt(p)} 打卡，预计 ${fmt(o)} 下班。`}
function icsDate(d){let z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return`${z.getUTCFullYear()}${pad(z.getUTCMonth()+1)}${pad(z.getUTCDate())}T${pad(z.getUTCHours())}${pad(z.getUTCMinutes())}${pad(z.getUTCSeconds())}`}
function esc(s){return String(s).replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;")}
function calendar(){let r=todayRec();if(!r){toast("请先打卡或补录时间");return}let p=new Date(r.punchAt),o=offDate(p),desc=`今天 ${fmt(p)} 打卡，预计 ${fmt(o)} 下班。`,ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Local Punch Clock//CN","CALSCALE:GREGORIAN","METHOD:PUBLISH","BEGIN:VEVENT",`UID:offwork-${key(o)}-${Date.now()}@local`,`DTSTAMP:${icsDate(new Date())}`,`DTSTART:${icsDate(o)}`,`DTEND:${icsDate(add(o,5))}`,"SUMMARY:下班时间",`DESCRIPTION:${esc(desc)}`,"BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY",`DESCRIPTION:${esc(desc)}`,"END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");let blob=new Blob([ics],{type:"text/calendar;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`下班提醒-${key(o)}.ics`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast("已生成日历提醒文件")}
function render(){let now=new Date(),r=todayRec();E.today.textContent=dateLabel(now);E.now.textContent=fmt(now);if(!r){E.hero.textContent="预计下班";E.off.textContent="--:--";E.punch.textContent="--:--";E.status.textContent="点击下方按钮记录今天的打卡时间";E.prog.style.width="0%";E.btn.textContent="打卡";E.btn.disabled=false;E.btn.className="primary";E.remind.disabled=true;E.copy.disabled=true;E.cal.disabled=true;E.reset.disabled=true;clearTimeout(rt);renderTrend();return}let p=new Date(r.punchAt),o=offDate(p),pct=Math.max(0,Math.min(100,((now-p)/(o-p))*100));E.hero.textContent=now>=o?"可以下班":"预计下班";E.off.textContent=fmt(o);E.punch.textContent=fmt(p);E.prog.style.width=pct+"%";E.btn.textContent="已打卡";E.btn.disabled=true;E.btn.className="locked";E.remind.disabled=false;E.copy.disabled=false;E.cal.disabled=false;E.reset.disabled=false;E.status.textContent=now>=o?`今天 ${fmt(p)} 打卡，已满 8.5 小时`:`${remain(o-now)} · 主按钮已锁定`;schedule(o);renderTrend()}
E.btn.onclick=()=>{if(todayRec())return;savePunch(new Date(),"button");askNotify()};
E.edit.onclick=()=>{setInputs();renderTrend();E.mask.classList.add("show")};E.close.onclick=()=>E.mask.classList.remove("show");E.mask.onclick=e=>{if(e.target===E.mask)E.mask.classList.remove("show")};
E.manual.oninput=hint;E.save.onclick=()=>{if(!E.manual.value)return toast("请填写打卡时间");let d=parseTime(E.manual.value),r=todayRec();if(r&&fmt(new Date(r.punchAt))!==fmt(d)&&!confirm(`将今天打卡时间从 ${fmt(new Date(r.punchAt))} 改为 ${fmt(d)}？`))return;savePunch(d,"manual");setInputs()};
E.offInput.oninput=()=>{if(!E.offInput.value)return;let o=parseTime(E.offInput.value),p=punchFromOff(o);E.reverseHint.textContent=`${fmt(o)} 下班，需要 ${fmt(p)} 打卡。`};
E.reverse.onclick=()=>{if(!E.offInput.value)return toast("请填写目标下班时间");let o=parseTime(E.offInput.value),p=punchFromOff(o),r=todayRec();E.manual.value=fmt(p);hint();E.reverseHint.textContent=`${fmt(o)} 下班，需要 ${fmt(p)} 打卡。`;if(r&&fmt(new Date(r.punchAt))!==fmt(p)&&!confirm(`将今天打卡时间从 ${fmt(new Date(r.punchAt))} 改为 ${fmt(p)}？`))return;savePunch(p,"reverse")};
E.remind.onclick=calendar;E.cal.onclick=calendar;E.notify.onclick=askNotify;E.copy.onclick=async()=>{let t=currentText();if(!t)return;try{await navigator.clipboard.writeText(t);toast("已复制")}catch{toast(t)}};E.reset.onclick=()=>{let r=load(),k=key();if(!r[k])return;if(!confirm("重置今天的打卡记录？"))return;delete r[k];saveAll(r);notified=null;render();setInputs();toast("已重置")};
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));render();setInterval(render,15000);document.addEventListener("visibilitychange",render);
})();
